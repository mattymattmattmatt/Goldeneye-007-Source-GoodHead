# DXVK settings for GoldenEye: Source VR. DXVK reads this file from the folder
# hl2.exe runs in (Source SDK Base 2007). Launch-GESVR installs it there once
# and then leaves your copy alone.
#
# hl2.exe is a 32-bit program without the large-address flag, so the whole game
# has 2 GB of address space, and DXVK 1.10 keeps a CPU-side copy of every
# managed texture in it for the whole session. That is what ran out with Very
# High textures (and likely at a 4K window). This drops each copy as soon as the
# texture has been uploaded to the graphics card; a texture the game rewrites
# later is read back from the card instead.
#
# To switch it off, put a # in front of the line below (deleting the file makes
# the launcher put it back).
# RESULT 2026-09-23: this did NOT make Very High textures work, and every
# crash that night (applying a texture detail change, loading a map at Very
# High -- even applying High) came after it went in, while textures were
# being reloaded. So it is off. The # below keeps it off.
# d3d9.evictManagedOnUnlock = True

# Shader compile threads. When a map loads, DXVK has the graphics driver
# compile its pipelines INSIDE the game's 32-bit process, and each compile takes
# a large bite of the same 2 GB the textures live in. Left on auto, an i7-8700
# (12 threads) got 7 state-cache threads plus 7 async threads -- 14 compiles at
# once, with 2794 cached pipelines queued at startup -- and the game died loading
# maps (an abort in ucrtbase, 0xc0000409), getting a little further each try as
# more of the compiled pipelines were cached. Two of each caps that spike; the
# price is that a map's first few seconds may show objects popping in while the
# rest compile. If a map still will not load, try 1 and 1.
dxvk.numCompilerThreads = 2
dxvk.numAsyncThreads = 2

# How much video memory the game is told it has. DXVK reports 4096 MB by
# default; Source asks once, through GetAvailableTextureMem, and sizes its own
# texture budget from the answer. With 4 GB on offer inside a 2 GB process it
# has no reason to hold back, and the measured map load climbs 1171 -> 1872 MB
# and dies at 1972 with a largest free block of 32 MB. 512 is still far more
# than the game can physically keep resident here, so nothing legitimate is
# refused -- it just stops the engine budgeting for room it does not have.
#
# UNTESTED as of 2026-09-27, and Source may simply ignore the number. If map
# loads are no better, put a # in front of it; if textures start swapping in
# and out visibly, raise it to 1024.
d3d9.maxAvailableMemory = 512

# NOT enabled, deliberately. memoryTrackTest makes DXVK enforce the number
# above rather than just report it -- D3D9CommonTexture throws
# "Reporting out of memory from tracking" once the budget is gone, and Source
# has no graceful answer to a texture that will not allocate. That converts a
# crash at 2 GB into a crash at whatever number we picked, which is not an
# improvement. Leave it off unless the failure is being deliberately moved
# somewhere easier to observe.
# d3d9.memoryTrackTest = True
