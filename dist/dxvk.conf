# DXVK settings for GoldenEye: Source VR. DXVK reads this file from the folder
# hl2.exe runs in (Source SDK Base 2007). Launch-GESVR installs it there once
# and then leaves your copy alone.
#
# hl2.exe is a 32-bit program without the large-address flag, so the whole game
# has 2 GB of address space, and DXVK 1.10 keeps a CPU-side copy of every
# managed texture in it for the whole session. That is what ran out with Very
# High textures (and likely at a 4K window). This drops each copy as soon as the
# texture has been uploaded to the graphics card; a texture the game rewrites
# later is read back from the card instead.
#
# To switch it off, put a # in front of the line below (deleting the file makes
# the launcher put it back).
# RESULT 2026-09-23: this did NOT make Very High textures work, and every
# crash that night (applying a texture detail change, loading a map at Very
# High -- even applying High) came after it went in, while textures were
# being reloaded. So it is off. The # below keeps it off.
# d3d9.evictManagedOnUnlock = True
